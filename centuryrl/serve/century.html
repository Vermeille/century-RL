<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Layout</title>
    <style>
body {
    display: flex;
    justify-content: center;
    flex-direction: column;  /* Stack children vertically */
    align-items: center;
    height: 100vh;
    background-color: #333;
}
.board {
    background-color: #222;
    padding: 20px;
    border-radius: 10px;
}
.row {
    display: flex;
    margin-bottom: 10px;
}
.card {
    width: 80px;
    height: 130px;
    margin: 0 5px;
    border-radius: 5px;
    background-color: #fff;
    background-size: cover;
}

.playable {
    box-shadow: 0px 0px 10px gold;
}
.vertical { flex-direction: column; }
.tokens {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
}
.token {
    width: 20px;
    height: 20px;
    margin: 2px 2px;
}
.yellow { background-color: gold; }
.red { background-color: red; }
.green { background-color: green; }
.brown { background-color: brown; }
.grey { background-color: grey; }
.silver { background-color: silver; }
.gold { background-color: gold; }
.coin {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    margin: 0 30px;
}
.decks {
    display: flex;
    justify-content: center;
    margin-top: 10px;
}
.points { text-align:center; font-size:3em;}
.white-text { color: white; }
.dialog {
    display: none; /* Hidden by default */
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px;
    border: 1px solid #333;
    background-color: white;
    z-index: 1000;
}

.dialog button {
    display: block;
    margin: 5px 0;
}
/* Add these CSS rules */
.card-container {
    position: relative;
    display: inline-block;
}

.analysis {
    aposition: absolute;
    top: -20px;
    right: 0;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    max-width: 200px;
    z-index: 100;
}
    </style>
</head>
<body>
    <div id="board"></div>
    <div id="dialog" class="dialog">
        <div id="dialogContent"></div>
        <div onclick="closeDialog()">Close</div>
    </div>
    <div>
        <select id="strategies"></select>
        <button onclick="analyze()">Analyze</button>
    </div>
<script>
let COLOR = {
    Y: 'yellow',
    R: 'red',
    G: 'green',
    B: 'brown',
    X: 'grey',
}

function render_stock(description) {
    return `
    <div class="tokens">
        ${[...description].map((x) =>
            `<div class="token ${COLOR[x]}"></div>`
        ).join('')}
    </div>`;
}

function render_card(content, moves, id, over='') {
    return `
        <div class="card-container" data-id="${id}">
            ${over}
            <div class="card" data-actions="${moves.join(",")}">
                ${content}
            </div>
            <div class="analysis"></div>
        </div>`;
}
function render_victory(stock, points, moves, id) {
    return render_card(`
        <div class="points">${points}</div>
        ${render_stock(stock)}
    `, moves, id);
}

function render_action(from_, to_, moves, id, cost='') {
    if (cost != '') {
        cost = render_stock(cost);
    }
    if (from_ == 'XX') {
        return render_card(`
            <div class="tokens">
                <div class="token grey"></div>
                <div class="token grey"></div>
            </div>
            <div class="points">→</div>
        `, moves, id, cost);
    } else if (from_ == 'XXX') {
        return render_card(`
            <div class="tokens">
                <div class="token grey"></div>
                <div class="token grey"></div>
                <div class="token grey"></div>
            </div>
            <div class="points">→</div>
        `, moves, id, cost);
    }
    return render_card(`
        ${render_stock(from_)}
        <div class="points">→</div>
        ${render_stock(to_)}
    `, moves, id, cost);
}

function parse_state(state) {
    let lines = state.split('\n');
    let round_num = parseInt(lines.shift());

    let board_ = lines.shift();
    console.assert(board_, '_Board');
    let line = lines.shift();
    let victory = []
    while (line[0] == 'V') {
        let desc = line.split(" ")[1].split("->");
        victory.push(desc);
        line = lines.shift();
    }

    let action = [];
    while (line[0] == 'A') {
        let [a_, transfo, token] = line.split(" ");
        transfo = transfo.split("->");
        token = token.split("->");
        action.push([transfo, token]);
        line = lines.shift();
    }

    let others = [];
    while (line.startsWith('_Him')) {
      let [him_, him_num, him_points] = line.split(" ");
      console.assert(him_ == '_Him');
      let [vv_, him_num_victory] = lines.shift().split(" ");
      console.assert(vv_, 'V');
      let [ss_, him_stock] = lines.shift().split(" ");
      console.assert(ss_, 'S');
      others.push({num: him_num, points: him_points, victory: him_num_victory, stock: him_stock});
      line = lines.shift();
    }

    let [me_, points] = line.split(" ");
    console.assert(me_ == '_Me');
    let [v_, me_num_victory] = lines.shift().split(" ");
    console.assert(v_, 'V');
    let [s_, stock] = lines.shift().split(" ");
    console.assert(s_, 'S');
    let hand = [];
    line = lines.shift();
    while (line[0] == 'H') {
        let h = line.split(" ")[1].split("->");
        hand.push(h);
        line = lines.shift();
    }
    let discard = [];
    while (line[0] == 'D') {
        discard.push(line.split(" ")[1]);
        line = lines.shift();
    }

    console.assert(line == '_Moves');
    line = lines.shift();
    let moves = [];
    while (line != undefined) {
        moves.push(line.substr(1));
        line = lines.shift();
    }

    return {
        round_num: round_num,
        my_points: parseInt(points),
        my_victory_cards_num: parseInt(me_num_victory),
        my_stock: stock,
        hand: hand,
        discard: discard,
        others: others,
        victory: victory,
        action: action,
        moves: moves,
    };
}

function moves_for(moves, prefix) {
    return moves.filter(m => m.startsWith(prefix));
}

function render_board(state) {
    let board = parse_state(state);
    let moves = board.moves;
    console.log(moves);
    return `<div class="board">
        ${board.others.map((o) =>
            `<div class="row">
                ${render_stock(o.stock)}
                <div class="points white-text">${o.points} (${o.victory})</div>
            </div>`).join('\n')
        }
        <hr>
        <div class="row">
            <div class="coin gold"></div>
            <div class="coin silver"></div>
        </div>
        <div class="row">
            ${board.victory.map((a, i) =>
                render_victory(a[0], a[1], moves_for(moves, `V${i}`), `V${i}`)
            ).join('')}
        </div>
        <hr>
        <div class="row">
            ${board.action.map((a, i) =>
                render_action(a[0][0], a[0][1], moves_for(moves, `A${i}`), `A${i}`, a[1][1])
            ).join('')}
        </div>
        <hr>
        <div class="row">
            ${render_stock(board.my_stock)}
            <div class="points white-text">${board.my_points} (${board.my_victory_cards_num})</div>
        </div>
        <div class="decks">
            <div class="row">
                ${render_card("Reload", moves_for(moves, 'R'), 'R')}
                ${board.hand.map((a, i) =>
                    render_action(a[0], a[1], moves_for(moves, `H${i}`), `H${i}`)
                ).join('')}
            </div>
        </div>
    </div>`;
}

async function refresh() {
    let root = document.getElementById('board');
    const response = await fetch('/board');
    const text = await response.text();
    root.innerHTML = render_board(text);
    make_clickable();
}


function show_dialog(content) {
    document.getElementById('dialogContent').innerHTML = '';
    document.getElementById('dialogContent').appendChild(content);
    document.getElementById('dialog').style.display = 'block';
}

function closeDialog() {
  document.getElementById('dialog').style.display = 'none';
}

function make_clickable() {
    document.querySelectorAll('.card').forEach(card => {
        const actions = card.getAttribute('data-actions').split(',');

        console.log(actions);
        if (actions[0] == '') {
            return;
        }

        card.classList.add("playable");

        card.addEventListener('click', function () {
            // Get actions from the card's data attribute and split it into an array
            let actions = card.getAttribute('data-actions').split(',');
            if (actions[0] == '') {
                actions = [];
            }

            // Clear any previous actions in the dialog
            const actionList = document.createElement('div');
            actionList.innerHTML = '';

            // Add actions as buttons in the dialog
            if (actions.length == 1) {
                sendActionToServer(actions[0]);
                return;
            }
            actions.forEach(action => {
                const actionButton = document.createElement('button');
                actionButton.textContent = action;
                actionButton.onclick = function () {
                    sendActionToServer(action);
                    closeDialog();

                };
                actionList.appendChild(actionButton);
            });

            // Show the dialog
            show_dialog(actionList);
        });
    });
}

async function sendActionToServer(action) {
    // Example using fetch to send action to the server
    const response = await fetch('/do', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ action: action, strategy: document.getElementById('strategies').value})
    });
    const state = await response.json();

    await refresh();
    if (!state.continue) {
        await refresh();
        let winner = document.createElement('div');
        winner.innerHTML = state.points >= 0 ? 'You won!' : 'You lost!';
        winner.innerHTML += '<br>';
        winner.innerHTML += 'Points: ' + state.points
        winner.innerHTML += '<br>';
        winner.innerHTML += 'Number of turns: ' + state.num_turns;
        winner.innerHTML += '<br>';
        let reset_button = document.createElement('button');
        reset_button.textContent = 'Play again';
        reset_button.onclick = function () {
        fetch('/reset').then(() => refresh());
            closeDialog();
            refresh();
        };
        winner.appendChild(reset_button);
        show_dialog(winner);
    }
}

async function analyze() {
    const response = await fetch('/analyze?' + new URLSearchParams({
        strategy: document.getElementById('strategies').value,
    }));
    const data = await response.json();
    document.querySelectorAll('.analysis').forEach(cardElement => {
        cardElement.innerHTML = '';
    });
    const moves = data.moves;
    for (const card in moves) {
        const cardElement = document.querySelector(`[data-id="${card.split(' ')[0]}"] .analysis`);
        if (!cardElement) {
            continue;
        }
        cardElement.innerHTML += `<p>${card}: ${Math.round(100*moves[card])/100}</p>`;
    }
}

async function get_strategies() {
    const response = await fetch('/strategies');
    const data = await response.json();
    const select = document.getElementById('strategies');
    select.innerHTML = '';
    for (const strategy of data) {
        const option = document.createElement('option');
        option.value = strategy;
        option.textContent = strategy;
        select.appendChild(option);
    }
}

refresh();
get_strategies();
</script>
</body>
</html>
