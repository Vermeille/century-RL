device: cpu
tag: policy-gradient

game: sum

net:
  num_layers: 6
  dim: 256
  head_size: 32

train:
  gradient_epochs: 1
  lr: 0.0001
  batch_size: 32
  show_every: 10
  save_every: 100
  loss:
    value: value_mse_loss,strength=0.1
    policy: policy_gradient_loss,label_smoothing=0.05

self_play:
  num_games: 4
  max_len: 500
  strategies:
    - policy_sampling,model=this
    - policy_sampling,model=this

pit:
  num_games: 32
  max_len: 220
  every: 100
  strategies:
    - policy_sampling,model=this
    - random
