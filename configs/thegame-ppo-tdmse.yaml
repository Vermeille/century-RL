tag: ppo-tdmse
device: cuda
game: thegame

model: cnn-large

pit:
  every: 20
  max_len: 800
  num_games: 23
  rotate: true
  strategies:
    - policy_sampling,model=this,temperature=0.2,include_moves=False
    - policy_sampling,model=this,temperature=0.2,include_moves=False

self_play:
  max_len: 5000
  num_games: 256
  rotate: true
  strategies:
    - policy_sampling,model=this,include_moves=False
    - policy_sampling,model=this,include_moves=False

train:
  optimizer: AdamW
  betas:
    - 0.5
    - 0.999
  batch_size: 256
  print_histories: false
  discount_factor: 1.0
  gradient_epochs: 2
  gae_lambda: 1.0
  reference_model_update: "True"
  reward_rescale: 0.01
  losses:
    - policy_gradient_loss,weight=normalized_gae,drift=ppo,imp_ratio_clip=0.2,strength=1
    - scheduled_perplexity,start=0.8,end=0.05,init_strength=0.1,baseline_ratio=0.2,adaptation_rate=0.005,ppl_beta=0.99,deadband=0.04
    - kl,strength=0.5
    - bootstrap_value_mse_loss,strength=1
  lr: 0.0001
  lr_min_scale: 0.3
  warmup_epochs: 15
  save_every: 50
  show_every: 5
  weight_decay: 0.01
  iterations: 1000
