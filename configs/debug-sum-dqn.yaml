device: cuda
tag: dqn

game: sum

net:
  num_layers: 4
  dim: 512
  head_size: 64

train:
  gradient_epochs: 1
  discount_factor: 0.8
  lr: 0.0001
  batch_size: 64
  show_every: 10
  save_every: 100
  loss:
    value: value_mse_loss,strength=0.
    policy: q_mse_loss

self_play:
  num_games: 50
  max_len: 500
  strategies:
    - argmax,model=this,epsilon=0.05
    - random

pit:
  num_games: 32
  max_len: 220
  every: 10
  strategies:
    - argmax,model=this
    - random
