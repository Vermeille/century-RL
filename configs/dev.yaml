device: cpu
tag: century-policygradient

model: extra-small
train:
  optimizer: AdamW
  gradient_epochs: 1
  lr: 0.0001
  batch_size: 12
  show_every: 10
  save_every: 10
  losses:
    - value_log_prob
    - policy_gradient_loss

self_play:
  num_games: 4
  max_len: 500
  strategies:
    - policy_sampling,model=this
    - policy_sampling,model=this

pit:
  num_games: 32
  max_len: 220
  every: 4
  strategies:
    - policy_sampling,model=this,temperature=0.001
    - random_buy
