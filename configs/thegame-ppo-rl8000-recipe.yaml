tag: ppo-rl8000-recipe
device: cpu
game: thegame

model: cnn

pit:
  every: 99999
  max_len: 80
  num_games: 1
  rotate: false
  strategies:
    - policy_sampling,model=this,temperature=0.2
    - random

self_play:
  max_len: 500
  num_games: 32
  rotate: true
  strategies:
    - policy_sampling,model=this
    - policy_sampling,model=this

train:
  optimizer: AdamW
  batch_size: 64
  print_histories: false
  discount_factor: 1.0
  gradient_epochs: 1
  gae_lambda: 0.98
  reference_model_update: "epoch % 1 == 0"
  reward_rescale: 0.1
  losses:
    - policy_gradient_loss,weight=normalized_gae,drift=ppo,imp_ratio_clip=0.2
    - scheduled_perplexity,start=0.4,end=-0.05,adaptation_rate=2
    - bootstrap_mse_loss,strength=0.1
  lr: 0.0005
  save_every: 100
  show_every: 25
  weight_decay: 0
  iterations: 8000
