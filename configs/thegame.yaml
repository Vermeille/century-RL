tag: a2c
device: cpu
game: thegame

model: small

pit:
  every: 25
  max_len: 220
  num_games: 32
  rotate: false
  strategies:
  - policy_sampling,model=this
  - policy_sampling,model=this

self_play:
  max_len: 500
  num_games: 64
  strategies:
  - policy_sampling,model=this
  - policy_sampling,model=this

train:
  optimizer: AdamW
  batch_size: 128
  discount_factor: 0.98
  gradient_epochs: 1
  gae_lambda: 0.95
  reference_model_update: "epoch % 1 == 0"
  reward_rescale: 0.1
  loss:
    policy: policy_gradient_loss,weight=gae,entropy_bonus=0.05,normalizer_alpha=0.9
    value: bootstrap_mse_loss,strength=0.0002
  lr: 0.0003
  save_every: 1000
  show_every: 10
