tag: a2c
device: cpu
game: thegame

model: extra-large

pit:
  every: 25
  max_len: 220
  num_games: 32
  rotate: false
  strategies:
  - policy_sampling,model=this
  - policy_sampling,model=this

self_play:
  max_len: 500
  num_games: 32
  strategies:
  - policy_sampling,model=this
  - policy_sampling,model=this

train:
  optimizer: AdamW
  batch_size: 64
  discount_factor: 0.995
  gradient_epochs: 1
  gae_lambda: 0.8
  reference_model_update: "epoch % 1 == 0"
  reward_rescale: 0.1
  losses:
    - policy_gradient_loss,weight=gae,normalizer_alpha=0.9
    - entropy_bonus,strength=0.05
    - bootstrap_mse_loss,strength=1
  lr: 0.00003
  save_every: 1000
  show_every: 50
  weight_decay: 0
