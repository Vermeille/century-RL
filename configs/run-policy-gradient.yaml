device: cpu
tag: policygradient

game: connectfour

net:
  num_layers: 4
  dim: 512
  head_size: 64

train:
  discount_factor: 1
  gradient_epochs: 1
  lr: 0.0001
  batch_size: 12
  show_every: 10
  save_every: 100
  loss:
    value: value_mse_loss,strength=0.1
    policy: policy_gradient_with_baseline_loss,label_smoothing=0.05

self_play:
  num_games: 10
  max_len: 500
  strategies:
    - policy_sampling,model=this
    - policy_sampling,model=this

pit:
  num_games: 32
  max_len: 220
  every: 10
  strategies:
    - policy_sampling,model=this
    - random
