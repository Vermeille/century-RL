device: cuda
tag: sum-supervised

game: sum

model: medium-deep
train:
  optimizer: AdamW
  gradient_epochs: 1
  lr: 0.0001
  batch_size: 32
  show_every: 10
  save_every: 100
  loss:
    value: value_mse_loss,strength=0.1
    policy: ce_loss

self_play:
  num_games: 4
  max_len: 500
  strategies:
    - sum_exact
    - sum_exact

pit:
  num_games: 32
  max_len: 220
  every: 100
  strategies:
    - policy_sampling,model=this
    - random
