device: cuda
tag: reinforce-selfplay-smallsmooth

game: sum

model: medium
train:
  optimizer: AdamW
  gradient_epochs: 1
  discount_factor: 0.8
  lr: 0.00001
  batch_size: 64
  show_every: 10
  save_every: 100
  losses:
    - value_mse_loss,strength=1
    - policy_gradient_loss,weight=advantage,normalizer_alpha=0.9
    - entropy_bonus,strength=0.01

self_play:
  num_games: 50
  max_len: 500
  strategies:
    - policy_sampling,model=this
    - policy_sampling,model=this

pit:
  num_games: 32
  max_len: 220
  every: 10
  strategies:
    - policy_sampling,model=this,temperature=0.001
    - random
