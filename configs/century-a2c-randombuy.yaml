device: cuda
tag: a2c

game: century

net:
  num_layers: 4
  dim: 512
  head_size: 64

train:
  gradient_epochs: 1
  discount_factor: 0.95
  lr: 0.0001
  batch_size: 8
  show_every: 10
  save_every: 50
  loss:
    value: value_mse_loss,strength=1
    policy: policy_gradient_loss,label_smoothing=0.05,weight=advantage,discount_factor=0.95,renormalize=True

self_play:
  num_games: 50
  max_len: 500
  strategies:
    - policy_sampling,model=this
    - century_random_buy

pit:
  num_games: 32
  max_len: 220
  every: 10
  strategies:
    - policy_sampling,model=this,temperature=0.001
    - century_random_buy
