name: State memory benchmark

on:
  push:
    branches: [ experiment/state-memory-slots ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Test compact state engines
        run: >-
          uv run pytest -q
          tests/test_games.py
          tests/test_hanabi.py
          tests/test_splendor.py
          tests/test_take5.py
          tests/test_regicide.py
          tests/test_skullking.py
          tests/test_santorini.py
          tests/test_thegame_copy.py
      - name: Benchmark retained trajectory states
        run: uv run python bench_state_storage.py
      - name: Benchmark state copy speed
        run: uv run python bench_state_timing.py
