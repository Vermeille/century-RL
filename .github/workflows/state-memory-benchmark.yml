name: State memory benchmark

on:
  push:
    branches: [ experiment/state-memory-slots ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install baseline
        run: uv sync --locked --all-extras --dev
      - name: Benchmark retained trajectory states
        run: uv run python bench_state_storage.py
      - name: Apply Century compact-state experiment
        run: python apply_century_compact.py
      - name: Rebuild Century extension
        run: uv sync --locked --all-extras --dev --reinstall-package century-rl
      - name: Benchmark compact Century retained states
        run: GAME_FILTER=century uv run python bench_state_storage.py
      - name: Benchmark compact Century copy speed
        run: GAME_FILTER=century uv run python bench_state_timing.py
