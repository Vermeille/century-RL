name: State memory benchmark

on:
  push:
    branches: [ experiment/state-memory-slots ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Century compact-state experiment
        run: python apply_century_compact.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Benchmark retained state memory
        run: uv run python bench_state_memory.py
      - name: Benchmark state copy speed
        run: uv run python bench_state_timing.py
