[project]
name = "century-rl"
version = "0.1.0"
description = "Reinforcement learning framework for board games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "tqdm",
    "cython",
    "visdom",
    "fastapi[standard]",
    "pyyaml",
    "natsort",
    "crayons",
    "psutil",
    "heavyball",
    "pytest",
    "pytest-timeout",
    "matplotlib",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["boardrl", "experiments"]
